5px;flex:none;background:#cdd6cf;color:white;display:grid;place-items:center;font-size:12px}.col{max-width:75%;min-width:0}.who{font-size:11px;color:#8a918c;margin-bottom:4px}.self .who{text-align:right}.bub{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;display:inline-block;border-radius:5px;padding:8px 11px;max-width:100%;box-shadow:0 1px 1px #00000008}.self .bub{background:#95ec69}.center{justify-content:center}.center .av{display:none}.center .bub{font-size:11px;background:#d6d9d6;color:#fff;padding:3px 8px}.pic{display:block;max-width:340px;max-height:420px;border-radius:6px}.emoimg{width:104px;height:104px;object-fit:contain}.card{display:flex;gap:10px;padding:12px;background:#fff;border-radius:6px;color:inherit;text-decoration:none;max-width:420px}.card .ic{font-size:11px;color:#788d7f}.card .ti{font-weight:600}.card .de,.tag{font-size:12px;color:#859186}.quote{border-left:3px solid #d6dfd7;padding-left:8px;font-size:12px;color:#7c8c80}.media-wait{padding:16px 20px;background:#fff;border-radius:6px;color:#7c9181;cursor:pointer;font-size:12px}.media-wait.error{background:#f9eee7;color:#98654b}.original-msg{font-size:10px;color:#98a398}.original-msg pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:600px}.badge{font-size:11px;color:#62806c}.notice{margin:10px;color:#778b7e;text-align:center;font-size:12px}@media(max-width:1000px){.app{grid-template-columns:270px 1fr}.toolbar{padding:9px 12px}.options{padding-bottom:0}.field input{width:165px}}

</style><style id="emoji-style"></style><style id="avatar-style"></style></head><body><div class="app"><aside><div class="brand"><span class="logo">聊</span><div>微信聊天导出器<div class="local">本地预览 · HTML / PDF / MD</div></div></div><div class="setup"><div class="account-root-row"><span id="account-root" title="请选择 xwechat_files 根目录">请选择微信记录根目录</span><button id="choose" title="选择 xwechat_files 这一层目录">目录</button></div><div class="account-picker"><select id="account" hidden aria-hidden="true" tabindex="-1"></select><button id="account-toggle" class="account-toggle" role="combobox" aria-label="选择微信账号" aria-haspopup="listbox" aria-expanded="false" aria-controls="account-menu"><span id="account-current"></span><span class="account-arrow">▾</span></button><div id="account-menu" class="account-menu" role="listbox" aria-label="目录下的微信账号" hidden></div></div><button class="primary sync" id="sync">读取 / 更新记录</button></div><input id="search" class="searchbox" placeholder="搜索会话、备注或昵称"><div class="list-summary" id="session-count">尚未读取</div><div id="session-list"></div><div class="side-bottom">仅对微信目录进行读取　<button class="linkbtn" id="datafolder">本地数据</button></div></aside><main class="main"><header class="header"><h1 id="title">选择一个会话</h1><div id="subtitle" class="sub">先读取本机微信记录，再选择需要导出的聊天</div></header><div class="toolbar"><div class="field"><label for="start-date">开始时间（北京时间）</label><div class="datetime-field"><input id="start-date" type="date" aria-label="开始时间（北京时间）日期"><input id="start-time" type="time" step="1" value="00:00:00" aria-label="开始时间（北京时间）时分秒"></div><input id="start" type="hidden"></div><div class="field"><label for="end-date">结束时间（含结束时刻）</label><div class="datetime-field"><input id="end-date" type="date" aria-label="结束时间（含结束时刻）日期"><input id="end-time" type="time" step="1" value="23:59:59" aria-label="结束时间（含结束时刻）时分秒"></div><input id="end" type="hidden"></div><button id="filter" disabled>筛选</button><button id="all" disabled>全部时间</button><div class="fill"></div><div class="export-actions"><label class="options"><input type="checkbox" id="online" checked>联网补全表情</label><label id="md-media-option" class="options" hidden><input type="checkbox" id="md-media" title="包含照片、自定义表情和微信内置表情">附带图片和表情</label><select id="export-format" aria-label="导出格式"><option value="html">HTML（单文件）</option><option value="pdf">PDF 文档</option><option value="md">Markdown（.md）</option></select><button id="export" class="primary" disabled>导出</button></div></div><div class="status" id="status"><span id="status-text"></span> <button id="open-export" class="linkbtn" hidden>打开导出文件</button>　<button id="open-export-folder" class="linkbtn" hidden>打开所在文件夹</button><div class="progress" id="progress"><i id="progress-bar" style="width:0"></i></div></div><section class="chat" id="chat"><div id="messages"><div class="empty"><h2>开始读取聊天记录</h2><p>登录电脑微信，选择账号并点击“读取 / 更新记录”。<br>照片和表情会在需要时加载，导出后无需联网查看。</p><p>支持照片、表情包和内置表情。语音、视频及文件消息保留记录，暂不嵌入对应附件。</p></div></div></section><footer class="bottom"><span id="message-count">尚未选择会话</span><div><button id="latest" disabled>跳到最近</button> <button id="more" disabled>加载后续消息</button></div></footer></main></div><div id="toast"></div>
<script>
let api,selected=null,offset=0,loaded=0,total=0,sessions=[],revision=-1,working=false,epoch=0,mediaQueue=[],mediaActive=0,mediaBusy=new Set(),avatarCache=new Map(),avatarRevision=0,bottomEpoch=null,accountItems=[],loadedAccount=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateTimeFields={};
function setupDateTimeFields(){
  for(const [id,defaultTime] of [['start','00:00:00'],['end','23:59:59']]){
    const date=$(id+'-date'),time=$(id+'-time'),value=$(id);
    const sync=()=>{value.value=date.value&&time.value?date.value+'T'+(time.value.length===5?time.value+':00':time.value):''};
    const reset=()=>{date.value='';time.value=defaultTime;value.value=''};
    date.addEventListener('input',sync);
    date.addEventListener('change',()=>{if(!date.value){reset();return}if(!time.value)time.value=defaultTime;sync()});
    time.addEventListener('input',sync);
    time.addEventListener('change',()=>{if(!time.value)time.value=defaultTime;sync()});
    dateTimeFields[id]={reset,sync,date,time};reset();
  }
}
function resetRange(){for(const field of Object.values(dateTimeFields))field.reset()}
function readRange(){
  for(const field of Object.values(dateTimeFields)){
    if(!field.date.reportValidity())return null;
    if(field.date.value&&(!field.time.value||!field.time.reportValidity())){toast('请选择完整的时、分、秒');field.time.focus();return null}
    field.sync();
  }
  if($('start').value&&$('end').value&&$('start').value>$('end').value){toast('开始时间不能晚于结束时间');return null}
  return [$('start').value,$('end').value];
}
function updateExportOptions(){$('md-media-option').hidden=$('export-format').value!=='md';buttons()}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',6000)}
async function call(name,...args){try{const r=await api[name](...args);if(r&&r.ok===false)throw Error(r.error);return r}catch(e){toast(e.message||String(e));throw e}}
function applyAvatars(map){for(const [k,v] of Object.entries(map||{}))avatarCache.set(k,v);$('avatar-style').textContent=[...avatarCache].map(([k,v])=>'.'+k+'{background-image:url("'+v+'");background-size:cover;background-position:center;font-size:0!important}').join('')}
const avatarObserver=new IntersectionObserver(async entries=>{const visible=entries.filter(e=>e.isIntersecting);if(!visible.length)return;visible.forEach(e=>avatarObserver.unobserve(e.target));const generation=avatarRevision;const map=await api.avatars(visible.map(e=>e.target.dataset.user));if(generation===avatarRevision)applyAvatars(map)},{root:$('session-list'),rootMargin:'100px'});
function stamp(ts){return new Date(ts*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})}
function buttons(){for(const id of ['filter','all','latest'])$(id).disabled=!selected; $('export').disabled=!selected||working;$('export-format').disabled=working;$('md-media').disabled=working;$('sync').disabled=working;$('choose').disabled=working;$('account').disabled=working;$('account-toggle').disabled=working||!accountItems.length;$('more').disabled=!selected||offset+loaded>=total}
function sameAccount(a,b){return String(a||'').replaceAll('/','\\').toLowerCase()===String(b||'').replaceAll('/','\\').toLowerCase()}
function accountLabel(a){const name=a.display_name||a.name||'待识别账号';const picture=a.avatar?'<img class="account-avatar" src="'+esc(a.avatar)+'" alt="'+esc(name)+'的头像">':'<span class="account-avatar">'+esc(name.slice(-2))+'</span>';return picture+'<span class="account-labels"><span class="account-name">'+esc(name)+'</span>'+(a.profile_pending?'<span class="account-id">首次读取后补齐微信名和头像</span>':'')+'</span>'}
function closeAccounts(){ $('account-menu').hidden=true;$('account-toggle').setAttribute('aria-expanded','false') }
function renderAccounts(state){accountItems=state.accounts||[];loadedAccount=state.current||null;$('account').innerHTML='';for(const a of accountItems)$('account').add(new Option(a.name,a.path));$('account').value=state.selected||accountItems[0]?.path||'';$('account-root').textContent=state.root||'请选择 xwechat_files 根目录';$('account-root').title=state.root||'';let current=accountItems.find(a=>sameAccount(a.path,$('account').value));$('account-current').innerHTML=current?accountLabel(current):'<span class="account-id">请先选择根目录</span>';$('account-menu').innerHTML='<div class="account-menu-head">此目录下 '+accountItems.length+' 个账号</div>';for(const a of accountItems){let option=document.createElement('button');option.className='account-option';option.setAttribute('role','option');option.setAttribute('aria-selected',String(sameAccount(a.path,$('account').value)));option.dataset.path=a.path;option.title=a.display_name||a.name;option.innerHTML=accountLabel(a);option.onclick=async()=>{await call('select_account',a.path);$('account').value=a.path;$('account-current').innerHTML=accountLabel(a);document.querySelectorAll('.account-option').forEach(o=>o.setAttribute('aria-selected',String(sameAccount(o.dataset.path,a.path))));closeAccounts();$('account-toggle').focus();await accountChanged()};option.onkeydown=e=>{let list=[...document.querySelectorAll('.account-option')],i=list.indexOf(option);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();list[(i+(e.key==='ArrowDown'?1:-1)+list.length)%list.length].focus()}if(e.key==='Escape'){closeAccounts();$('account-toggle').focus()}};$('account-menu').appendChild(option)}closeAccounts();buttons()}
async function accountChanged(){selected=null;epoch++;bottomEpoch=null;mediaQueue=[];mediaBusy.clear();avatarRevision++;avatarCache.clear();$('avatar-style').textContent='';$('title').textContent='选择一个会话';resetRange();$('message-count').textContent='尚未选择会话';if(sameAccount($('account').value,loadedAccount)&&loadedAccount){await loadSessions();$('subtitle').textContent='已载入此账号的本地索引';$('messages').innerHTML='<div class="empty"><h2>选择左侧会话</h2><p>按时间范围预览并导出聊天记录。</p></div>'}else{$('session-list').innerHTML='';$('session-count').textContent='尚未读取此账号';$('subtitle').textContent='点击左侧读取 / 更新记录，载入所选账号';$('messages').innerHTML='<div class="empty"><h2>读取所选账号</h2><p>请先在电脑微信中登录这个账号，再点击读取 / 更新记录。</p></div>'}buttons()}
function setupAccountMenu(){ $('account-toggle').onclick=()=>{if(!accountItems.length)return;const open=$('account-menu').hidden;$('account-menu').hidden=!open;$('account-toggle').setAttribute('aria-expanded',String(open))};$('account-toggle').onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();$('account-menu').hidden=false;$('account-toggle').setAttribute('aria-expanded','true');$('account-menu').querySelector('[aria-selected="true"]')?.focus()}};document.addEventListener('click',e=>{if(!e.target.closest('.account-picker'))closeAccounts()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAccounts()}) }
async function loadSessions(){if(!sameAccount($('account').value,loadedAccount)||!loadedAccount){$('session-list').innerHTML='';$('session-count').textContent='尚未读取此账号';return}sessions=await call('sessions',$('search').value);$('session-count').textContent=sessions.length+' 个会话';$('session-list').innerHTML='';for(const s of sessions){let b=document.createElement('button');b.className='session'+(selected?.username===s.username?' active':'');b.dataset.username=s.username;b.innerHTML='<span class="avatar '+s.avatar_class+'" data-user="'+esc(s.username)+'">'+esc(s.display.slice(-2))+'</span><span class="session-main"><span class="session-title">'+esc(s.display)+'</span><span class="session-meta"><span>'+s.count+' 条消息</span><span>'+stamp(s.last_ts).split(' ')[0]+'</span></span></span>';b.onclick=()=>select(s);$('session-list').appendChild(b)}avatarObserver.disconnect();document.querySelectorAll('.avatar[data-user]').forEach(e=>avatarObserver.observe(e))}
async function select(s){selected=s;epoch++;mediaQueue=[];mediaBusy.clear();$('title').textContent=s.display;$('subtitle').textContent=(s.nick&&s.nick!==s.display?'昵称：'+s.nick+' · ':'')+s.count+' 条本地消息';resetRange();buttons();document.querySelectorAll('.session').forEach(b=>b.classList.toggle('active',b.dataset.username===s.username));await loadMessages(false,false)}
function pinLatest(){if(bottomEpoch===epoch){const chat=$('chat');chat.scrollTop=chat.scrollHeight}}
new ResizeObserver(()=>{if(bottomEpoch===epoch)requestAnimationFrame(pinLatest)}).observe($('messages'));
for(const event of ['wheel','touchstart','pointerdown'])$('chat').addEventListener(event,()=>{bottomEpoch=null},{passive:true});
document.addEventListener('keydown',e=>{if(['PageUp','ArrowUp','Home'].includes(e.key)&&!e.target.matches('input,textarea,select'))bottomEpoch=null});
async function loadMessages(append=false,latest=false){if(!selected)return;const range=readRange();if(!range)return;bottomEpoch=null;const thisEpoch=++epoch;mediaQueue=[];mediaBusy.clear();const r=await call('messages',selected.username,$('start').value,$('end').value,append?offset+loaded:0,latest);if(thisEpoch!==epoch)return;applyAvatars(r.avatars);if(!append){$('messages').innerHTML=r.html;offset=r.offset;loaded=r.loaded;$('chat').scrollTop=0}else{$('messages').insertAdjacentHTML('beforeend',r.html);loaded+=r.loaded}total=r.total;$('message-count').textContent='符合时间范围 '+total+' 条 · 当前显示 '+loaded+' 条';if(!total)$('messages').innerHTML='<div class="empty">这个时间段没有消息</div>';buttons();observe();if(latest){bottomEpoch=thisEpoch;requestAnimationFrame(pinLatest)}}
const observer=new IntersectionObserver(entries=>{for(const e of entries)if(e.isIntersecting){observer.unobserve(e.target);queueMedia(e.target)}},{root:$('chat'),rootMargin:'150px'});
function observe(){observer.disconnect();document.querySelectorAll('.media-wait:not(.error)').forEach(e=>{observer.observe(e);e.onclick=()=>queueMedia(e)})}
function queueMedia(el){if(!el.isConnected||mediaBusy.has(el))return;mediaBusy.add(el);mediaQueue.push({el,epoch});pumpMedia()}
function pumpMedia(){while(mediaActive<2&&mediaQueue.length){const item=mediaQueue.shift();mediaActive++;api.load_media(item.el.dataset.key||item.el.dataset.mid,$('online').checked).then(r=>{if(!item.el.isConnected||item.epoch!==epoch)return;if(r.ok){let article=item.el.closest('article');article.innerHTML=r.html}else{item.el.textContent=r.error;item.el.classList.add('error');item.el.onclick=()=>{mediaBusy.delete(item.el);queueMedia(item.el)}}}).catch(e=>{if(item.el.isConnected){item.el.textContent='图片加载失败';item.el.classList.add('error')}}).finally(()=>{mediaActive--;pumpMedia()})}}

if(s.revision!==revision){revision=s.revision;if(!s.running&&s.kind==='sync'&&!s.error){renderAccounts(await call('account_list'));avatarRevision++;avatarCache.clear();$('avatar-style').textContent='';await loadSessions();if(selected){let match=sessions.find(x=>x.username===selected.username);if(match)await select(match);else{selected=null;epoch++;$('title').textContent='选择一个会话';$('subtitle').textContent='账号已切换，请从左侧选择会话';$('messages').innerHTML='<div class="empty">请选择一个会话</div>';buttons()}}}}}catch(e){}setTimeout(poll,600)}
